<script>
(function () {
  'use strict';

  var SESSION_KEY = 'investigation.session';
  var STAGE_LABELS = {
    1: 'ได้ข่าว',
    2: 'พิสูจน์ทราบตัวบุคคล',
    3: 'เฝ้าติดตาม',
    4: 'รวบรวมหลักฐาน/ขอหมายจับ',
    5: 'จับกุมแล้ว'
  };
  var session = null;
  var currentView = 'login';
  var currentCaseId = '';
  var currentBundle = null;
  var selectedStage = 0;
  var editingEntryId = null;
  var photoReq = 0;
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    var props = attrs || {};
    Object.keys(props).forEach(function (key) {
      if (key === 'class') node.className = props[key];
      else if (key === 'text') node.textContent = props[key];
      else if (props[key] != null && props[key] !== false) node.setAttribute(key, String(props[key]));
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function messageOf(err) {
    if (!err) return 'เกิดข้อผิดพลาด';
    var t = typeof err === 'string' ? err : (err.message || 'เกิดข้อผิดพลาด');
    return String(t).replace(/^(\s*(Exception|Error|TypeError)\s*:\s*)+/i, '') || 'เกิดข้อผิดพลาด';
  }

  function call(name, args) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('เปิดผ่านเว็บแอปที่ติดตั้งแล้ว'));
        return;
      }
      var run = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(new Error(messageOf(err))); });
      run[name].apply(run, args || []);
    });
  }

  function toast(text) {
    var node = $('toast');
    node.textContent = text;
    node.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.hidden = true; }, 2600);
  }

  function safeHttp(url) {
    var text = String(url || '').trim();
    if (!/^https?:\/\//i.test(text)) return '';
    return text;
  }

  function safeImg(src) {
    if (!src) return '';
    if (/^data:image\/(jpeg|png|webp);base64,/i.test(src)) return src;
    if (/^\/sample\/photos\/[a-z0-9.-]+$/i.test(src)) return src;
    return '';
  }

  function show(view) {
    ['login', 'home', 'case', 'form'].forEach(function (name) {
      $('view-' + name).hidden = name !== view;
    });
    currentView = view;
    $('who').hidden = view === 'login';
    syncDock();
    window.scrollTo(0, 0);
  }

  function syncDock() {
    var onCase = currentView === 'case';
    var closed = !!(currentBundle && currentBundle.card && currentBundle.card.status === 'closed');
    $('dock').hidden = currentView === 'login';
    $('logout').hidden = currentView === 'login';
    $('btn-back').hidden = !onCase;
    $('btn-add-entry').hidden = !onCase || closed;
    $('btn-edit-next').hidden = !onCase || closed;
  }

  function applyRole() {
    var boss = session && session.user && session.user.role === 'boss';
    $('btn-summary').hidden = !boss;
    var name = $('who-name');
    clear(name);
    if (!session) return;
    name.appendChild(document.createTextNode(session.user.name));
    if (boss) name.appendChild(el('span', { class: 'role-pill', text: 'ผู้บังคับบัญชา' }));
  }

  function todayInput() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Bangkok',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(new Date());
    function pick(type) {
      return parts.filter(function (part) { return part.type === type; })[0].value;
    }
    return pick('year') + '-' + pick('month') + '-' + pick('day');
  }

  function stageBar(stage) {
    var bar = el('div', { class: 'bar', role: 'img', 'aria-label': 'ขั้น ' + stage + ' จาก 5' });
    var i;
    for (i = 1; i <= 5; i += 1) {
      bar.appendChild(el('span', { class: i <= stage ? 'on' : '', text: String(i), title: STAGE_LABELS[i] }));
    }
    return bar;
  }

  function chips(items) {
    if (!items || !items.length) return null;
    var wrap = el('div', { class: 'chips' });
    items.forEach(function (item) { wrap.appendChild(el('span', { class: 'chip', text: item })); });
    return wrap;
  }

  var syncingIds = {};
  function syncLine(text) {
    return el('p', { class: 'sync-line' }, [
      el('span', { class: 'spinner', 'aria-hidden': 'true' }),
      document.createTextNode(' ' + text)
    ]);
  }
  function cardNode(card) {
    var closed = card.status === 'closed';
    var node = el('article', {
      class: 'card ' + (closed ? 'closed' : 'open'),
      id: 'card-' + card.id,
      role: 'button',
      tabindex: '0',
      'aria-label': card.name + (closed ? ' ปิดแล้ว' : ' กำลังติดตาม')
    });
    if (card.bchLinked) node.setAttribute('data-bch', '1');
    if (syncingIds[card.id]) node.setAttribute('aria-busy', 'true');
    var head = el('div', { class: 'card-head' });
    head.appendChild(el('h2', { text: card.name }));
    if (closed) head.appendChild(el('span', { class: 'status-check', text: '✓', 'aria-hidden': 'true' }));
    node.appendChild(head);
    node.appendChild(el('p', { text: 'เป้าหมาย: ' + card.mainTarget }));
    node.appendChild(stageBar(card.stage));
    node.appendChild(el('p', { text: card.stageLabel }));
    node.appendChild(el('p', { class: 'note', text: (card.lastUpdateText || '—') + ' · ' + card.latestNote }));
    if (syncingIds[card.id]) node.appendChild(syncLine('กำลังดึงข้อมูลคดีนี้…'));
    function open() { openCase(card.id); }
    node.addEventListener('click', open);
    node.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
    });
    return node;
  }
  function renderCards(cards) {
    var list = $('card-list');
    clear(list);
    if (!cards.length) {
      var empty = $('show-closed').checked ? 'ยังไม่มีเคส' : 'ยังไม่มีเคสที่เปิดอยู่';
      list.appendChild(el('p', { class: 'muted', text: empty }));
      return;
    }
    cards.forEach(function (card) { list.appendChild(cardNode(card)); });
  }
  function replaceCard(card) {
    var old = document.getElementById('card-' + card.id);
    if (!old) return;
    old.replaceWith(cardNode(card));
  }

  function outcomeEditor(target, outcomes) {
    var select = el('select', { 'aria-label': 'สถานะเป้าหมาย' });
    outcomes.forEach(function (o) {
      var opt = el('option', { value: o.id, text: o.label });
      if (o.id === target.outcome) opt.selected = true;
      select.appendChild(opt);
    });
    var date = el('input', { type: 'date', 'aria-label': 'วันที่ (ไม่บังคับ)' });
    date.value = target.outcomeDate || '';
    var note = el('input', { type: 'text', maxlength: '500', placeholder: 'หมายเหตุ เช่น หน่วยที่จับ', 'aria-label': 'หมายเหตุ' });
    note.value = target.outcomeNote || '';
    var save = el('button', { type: 'button', class: 'btn ghost', text: 'บันทึกสถานะ' });
    save.addEventListener('click', function (event) {
      event.stopPropagation();
      save.disabled = true;
      call('updateTargetOutcome', [session.token, target.id, { outcome: select.value, outcomeDate: date.value, outcomeNote: note.value }])
        .then(function () { toast('บันทึกสถานะแล้ว'); refreshFilesInBackground(currentCaseId); return call('getCase', [session.token, currentCaseId]); })
        .then(function (b) { if (b) { renderCase(b); setTargetsOpen(true); } })
        .catch(function (err) { save.disabled = false; toast(err.message); });
    });
    [select, date, note].forEach(function (n) { n.addEventListener('click', function (e) { e.stopPropagation(); }); });
    return el('div', { class: 'outcome-edit' }, [select, date, note, save]);
  }

  function renderCase(bundle) {
    currentBundle = bundle;
    var card = bundle.card;
    var closed = card.status === 'closed';
    $('case-kicker').textContent = card.statusLabel + ' · เปิดเมื่อ ' + (card.openedText || '');
    $('case-name').textContent = card.name;
    $('case-detail').textContent = card.detail || '';
    var stageHost = $('case-stage');
    clear(stageHost);
    stageHost.appendChild(stageBar(card.stage));
    $('case-stage-label').textContent = card.stageLabel;
    var meta = 'อัปเดตล่าสุด ' + (card.lastUpdateText || '—');
    if (!closed && bundle.closable) meta += ' · เป้าหมายครบแล้ว ปิดเคสได้ (บันทึกขั้น 5)';
    $('case-meta').textContent = meta;
    $('case-next').textContent = card.nextStep || 'ยังไม่ระบุขั้นต่อไป';
    $('btn-add-target').hidden = closed;
    renderExtSummary(bundle);
    $('arrest-box').hidden = !closed;
    $('case-arrest-url').value = card.arrestRecordUrl || '';
    var linkHost = $('arrest-link');
    clear(linkHost);
    var url = safeHttp(card.arrestRecordUrl);
    if (url) {
      var anchor = el('a', { href: url, target: '_blank', rel: 'noopener noreferrer', text: url });
      linkHost.appendChild(anchor);
    } else {
      linkHost.textContent = 'ยังไม่ได้ใส่ลิงก์';
    }

    var targets = $('target-list');
    clear(targets);
    if (!bundle.targets.length) targets.appendChild(el('p', { class: 'muted', text: 'ยังไม่มีเป้าหมาย' }));
    bundle.targets.forEach(function (target) {
      var photoSrc = safeImg(target.photoSrc);
      var photo = photoSrc ? el('img', { src: photoSrc, alt: '' }) : el('div', { class: 'nophoto', text: 'ไม่มีรูป' });
      photo.setAttribute('data-target-photo', target.id);
      var detail = el('div', { class: 'person-detail' });
      var PL = ((bundle.persons || []).filter(function (x) { return x.id === target.id; })[0] || {}).lines || [];
      PL.forEach(function (f) { detail.appendChild(el('p', { class: f[0] === 'สถานะ' ? 'outcome-line' : '' }, [el('span', { class: 'k', text: f[0] + ': ' }), document.createTextNode(f[1])])); });
      /* อ่านอย่างเดียว: แก้สถานะเป้าหมายที่ระบบ บช. */
      var body = el('div', { class: 'person-body' }, [
        el('strong', { class: 'person-name', text: target.name }),
        detail
      ]);
      var caught = /^caught/.test(String(target.outcome || ''));
      var photoBox = caught ? el('span', { class: 'photo-wrap' }, [photo, el('span', { class: 'arrest-band', text: 'จับกุมแล้ว' })]) : photo;
      targets.appendChild(el('article', { class: 'person' + (target.arrested ? '' : ' live') }, [photoBox, body]));
    });

    (bundle.persons || []).filter(function (x) { return x.src === 'บช.'; }).forEach(function (x) {
      var d = el('div', { class: 'person-detail' });
      x.lines.forEach(function (f) { d.appendChild(el('p', {}, [el('span', { class: 'k', text: f[0] + ': ' }), document.createTextNode(f[1])])); });
      targets.appendChild(el('article', { class: 'person live' }, [el('div', { class: 'nophoto', text: 'บช.' }), el('div', { class: 'person-body' }, [el('strong', { class: 'person-name', text: x.name + ' (ข้อมูล บช.)' }), d])]));
    });

    var entries = $('entry-list');
    clear(entries);
    if (!bundle.entries.length) entries.appendChild(el('p', { class: 'muted', text: 'ยังไม่มีความคืบหน้า' }));
    bundle.entries.forEach(function (entry) {
      var block = el('article', { class: 'step' });
      block.appendChild(el('p', { class: 'when', text: entry.entryDateText }));
      block.appendChild(el('h3', { text: 'ขั้น ' + entry.stage + ' · ' + entry.stageLabel }));
      block.appendChild(el('p', { text: entry.text }));
      [chips(entry.phones), chips(entry.plates), chips(entry.people)].forEach(function (node) {
        if (node) block.appendChild(node);
      });
      if (entry.photoCount) {
        var row = el('div', { class: 'shots', 'data-entry-photos': entry.id });
        row.appendChild(el('p', { class: 'muted', text: 'กำลังโหลดรูป ' + entry.photoCount + ' รูป…' }));
        block.appendChild(row);
      }
      block.appendChild(el('p', { class: 'by', text: entry.authorName + ' · บันทึก ' + entry.createdAtText }));
      entries.appendChild(block);
    });
    var stage5 = document.querySelector('#stage-picker button[data-stage="5"]');
    if (stage5) {
      stage5.disabled = !bundle.closable;
      stage5.title = bundle.closable ? '' : 'ปิดเคสได้เมื่อเป้าหมายทุกคนจับแล้ว หน่วยอื่นจับ หรือเสียชีวิต';
    }
    setTargetsOpen(false);
    show('case');
  }

  function setTargetsOpen(open) {
    var board = $('case-board');
    if (!board) return;
    board.classList.toggle('targets-open', !!open);
  }

  function loadHome(silent) {
    if (!session) return Promise.resolve();
    if (!silent) $('home-status').textContent = 'กำลังโหลดเคส…';
    return call('listCases', [session.token, $('show-closed').checked]).then(function (res) {
      $('home-status').textContent = '';
      $('home-error').hidden = true;
      renderCards(res.cards || []);
    }).catch(function (err) {
      if (/เซสชัน|เข้าสู่ระบบ/.test(err.message)) {
        logout(true);
        showLoginError(err.message);
        return;
      }
      $('home-status').textContent = '';
      $('home-error').hidden = false;
      $('home-error').textContent = err.message;
    });
  }

  var homePullBusy = false;
  function paintCaseSync(id) {
    var node = $('case-sync');
    if (!node || currentCaseId !== id) return;
    if (syncingIds[id]) {
      node.hidden = false;
      clear(node);
      node.appendChild(el('span', { class: 'spinner', 'aria-hidden': 'true' }));
      node.appendChild(document.createTextNode(' กำลังดึงข้อมูลคดีนี้…'));
    } else {
      node.hidden = true;
    }
  }
  function finishSync() {
    Object.keys(syncingIds).forEach(function (id) { delete syncingIds[id]; });
    document.querySelectorAll('#card-list .sync-line').forEach(function (node) { node.remove(); });
    document.querySelectorAll('#card-list [aria-busy="true"]').forEach(function (node) { node.removeAttribute('aria-busy'); });
    var banner = $('case-sync');
    if (banner) banner.hidden = true;
  }
  function refreshCard(caseId, changed) {
    call('getCaseCard', [session.token, caseId]).then(function (card) {
      if (card) replaceCard(card);
      paintCaseSync(caseId);
      if (changed && currentCaseId === caseId && currentView === 'case') {
        call('getCase', [session.token, caseId]).then(function (bundle) {
          if (currentCaseId !== caseId || !bundle) return;
          renderCase(bundle);
          loadPhotos(caseId);
        }).catch(function () { /* keep the case already on screen */ });
      }
    }).catch(function () {
      var node = document.getElementById('card-' + caseId);
      var line = node && node.querySelector('.sync-line');
      if (line) line.remove();
    });
  }
  function watchSync(reqId) {
    var seen = {};
    return new Promise(function (resolve, reject) {
      var until = Date.now() + 180000;
      (function tick() {
        call('bchSyncProgress', [session.token, reqId]).then(function (status) {
          (status.items || []).forEach(function (item) {
            if (!item || seen[item.caseId] || item.state === 'queued') return;
            seen[item.caseId] = 1;
            delete syncingIds[item.caseId];
            refreshCard(item.caseId, !!item.changed);
          });
          if (status.done) {
            if (status.ok === false && status.err) reject(new Error(status.err));
            else resolve();
            return;
          }
          if (Date.now() > until) { reject(new Error('timeout')); return; }
          setTimeout(tick, 1200);
        }).catch(reject);
      })();
    });
  }
  function openCase(id, fromPop) {
    if (!fromPop) { try { var hs = history.state || {}; if (hs.trk === 'case') history.replaceState({ trk: 'case', id: id }, ''); else history.pushState({ trk: 'case', id: id }, ''); } catch (e) {} }
    currentCaseId = id; try { sessionStorage.setItem('trk_cur_case', id); } catch (e) {}
    $('case-name').textContent = 'กำลังเปิดเคส…';
    var updateStatus = $('update-status');
    if (updateStatus) updateStatus.textContent = '';
    show('case');
    call('getCase', [session.token, id]).then(function (b) { renderCase(b); loadPhotos(id); loadFilesStatus(id); loadBchSync(id); loadBchData(id, false); loadCaseOutputs(id); paintCaseSync(id); }).catch(function (err) {
      toast(err.message);
      show('home');
    });
  }

  function loadPhotos(id) {
    var req = ++photoReq;
    call('getCasePhotos', [session.token, id]).then(function (res) {
      if (req !== photoReq || currentCaseId !== id || !res) return;
      Object.keys(res.entries || {}).forEach(function (eid) {
        var host = document.querySelector('[data-entry-photos="' + eid + '"]');
        if (!host) return;
        clear(host);
        (res.entries[eid] || []).map(safeImg).filter(Boolean).forEach(function (src) { host.appendChild(el('img', { src: src, alt: '' })); });
      });
      Object.keys(res.targets || {}).forEach(function (tid) {
        var src = safeImg(res.targets[tid]);
        var node = document.querySelector('[data-target-photo="' + tid + '"]');
        if (!src || !node) return;
        var img = el('img', { src: src, alt: '' });
        img.setAttribute('data-target-photo', tid);
        node.parentNode.replaceChild(img, node);
      });
      document.querySelectorAll('[data-entry-photos] p.muted').forEach(function (p) { p.textContent = 'ไม่มีรูปที่แสดงได้'; });
    }).catch(function () {
      document.querySelectorAll('[data-entry-photos] p.muted').forEach(function (p) { p.textContent = 'โหลดรูปไม่สำเร็จ'; });
    });
  }

  function openEditEntry(entry) {
    openForm('entry');
    editingEntryId = entry.id;
    $('form-title').textContent = 'แก้ไขขั้นตอน';
    $('entry-date').value = String(entry.entryDate || '').slice(0, 10);
    $('entry-time').value = entry.eventTime || '';
    $('entry-text').value = entry.text || '';
    $('entry-phones').value = (entry.phones || []).join(', ');
    $('entry-plates').value = (entry.plates || []).join(', ');
    $('entry-people').value = (entry.people || []).join(', ');
    selectedStage = Number(entry.stage) || 0;
    paintStages();
    var s5 = document.querySelector('#stage-picker button[data-stage="5"]');
    if (s5) s5.disabled = true;
    $('entry-photo-box').hidden = true;
    $('entry-edit-note').hidden = false;
    $('entry-submit').textContent = 'บันทึกการแก้ไข';
  }

  function showLoginError(text) {
    var node = $('login-error');
    node.hidden = !text;
    node.textContent = text || '';
  }

  function fillUserSelect(users) {
    var current = $('user-id');
    var next = current.cloneNode(false);
    next.id = 'user-id';
    next.name = 'user';
    next.required = true;
    var list = users || [];
    next.add(new Option('เลือกชื่อเจ้าหน้าที่', ''));
    list.forEach(function (user) {
      if (!user || !user.name) return;
      next.add(new Option(user.name, user.id || user.name));
    });
    next.add(new Option('อื่นๆ (กรอกเอง)', '__other__'));
    current.parentNode.replaceChild(next, current);
  }

  var ROSTER = [
    { id: 'u-surriya', name: 'ร.ต.อ.สุริยา วรรณพฤกษ์' },
    { id: 'u-sittichai', name: 'ด.ต.สิทธิชัย วงศ์ธรรม' },
    { id: 'u-amarin', name: 'ส.ต.อ.อัมรินทร์ พรมเมืองขวา' },
    { id: 'u-kanasawat', name: 'ด.ต.คณาสวัสดิ์ อาจวิชัย' },
    { id: 'u-rapeerat', name: 'จ.ส.ต.รพีรัฐ ปัดเกษม' },
    { id: 'u-atchariya', name: 'จ.ส.ต.อัจฉะริยะ จักรเรืองชัย' },
    { id: 'u-aniwat', name: 'ส.ต.อ.อนิวัฒน์ พลตื้อ' },
    { id: 'u-chittiwat', name: 'ส.ต.อ.จิตรทิวัส แก้วหลวง' },
    { id: 'u-nattawut', name: 'จ.ส.ต.ณัฐวุฒิ บุตรโส' }
  ];
  fillUserSelect(ROSTER);

  function logout(silent) {
    session = null;
    currentBundle = null;
    currentCaseId = '';
    sessionStorage.removeItem(SESSION_KEY);
    applyRole();
    if (!silent) show('login');
  }


  // ===== ข้อมูลรายงาน บช.ตชด. =====
  var EXT_TYPES = [['A','A ยาเสพติด'],['B','B หลบหนีเข้าเมือง/ค้ามนุษย์'],['C','C ทรัพยากรป่าไม้'],['D','D สินค้าหนีภาษี'],['E','E ความมั่นคง'],['F','F อื่นๆ'],['U','U ไม่ทราบ']];
  var EXT_STATUS = ['กำลังดำเนินการ', 'เสร็จสิ้น'];
  var EXT_URL = 'https://script.google.com/macros/s/AKfycbznIfamZANZAR6yQPNGdwvpzRGvlRflARViZL6icF07tbQFB0sl1xLUQ6eZtEo_FP1aSA/exec';
  var EXT_RANKS = ['พล.ต.อ.','พล.ต.ท.','พล.ต.ต.','พ.ต.อ.','พ.ต.ท.','พ.ต.ต.','ร.ต.อ.','ร.ต.ท.','ร.ต.ต.','ด.ต.','จ.ส.ต.','ส.ต.อ.','ส.ต.ท.','ส.ต.ต.'];
  var EXT_LEADER = { rank: 'ร.ต.อ.', first: 'สุริยา', last: 'วรรณพฤกษ์', phone: '' };
  var extHandle = null, caseExtHandle = null;

  function splitPerson(full) {
    var s = String(full || '').trim(), rank = '';
